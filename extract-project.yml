name: Extract SafeCore Project

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  extract:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          set -e

          unzip -o safecore-vercel-fixed.zip -d extracted

          if [ -d "extracted/safecore" ]; then
            cp -a extracted/safecore/. .
          else
            cp -a extracted/. .
          fi

          rm -rf extracted

      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi

          git commit -m "Extract SafeCore project"
          git push
